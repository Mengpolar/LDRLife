name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-ci.log || true
          grep -q "BUILD SUCCESSFUL" /tmp/gradle-ci.log || { tail -120 /tmp/gradle-ci.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle-ci.log

      - name: Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LDRLife-debug.apk
          sha256sum LDRLife-debug.apk > LDRLife-debug.apk.sha256
          cat LDRLife-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDRLife-debug-apk
          path: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256

      # 打 tag（v*）时自动创建 GitHub Release 并附 APK 与校验文件
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256
