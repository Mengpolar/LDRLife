name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-ci.log || true
          grep -q "BUILD SUCCESSFUL" /tmp/gradle-ci.log || { tail -150 /tmp/gradle-ci.log > /tmp/fail-tail.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ runner.os }}
          path: |
            /tmp/gradle-ci.log
            /tmp/fail-tail.log
            build.log

      - name: Dump failure to step summary
        if: failure()
        run: |
          echo "### gradle log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/gradle-ci.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### sdk install log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/sdk-install.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LDRLife-debug.apk
          sha256sum LDRLife-debug.apk > LDRLife-debug.apk.sha256
          cat LDRLife-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDRLife-debug-apk
          path: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256

      # 打 tag（v*）时自动创建 GitHub Release 并附 APK 与校验文件（Windows 通道发布，避免双 job 竞争）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256
