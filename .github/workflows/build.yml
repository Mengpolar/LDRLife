name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-ci.log || true
          grep -q "BUILD SUCCESSFUL" /tmp/gradle-ci.log || { tail -150 /tmp/gradle-ci.log > /tmp/fail-tail.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ runner.os }}
          path: |
            /tmp/gradle-ci.log
            /tmp/fail-tail.log
            build.log

      - name: Dump failure to step summary
        if: failure()
        run: |
          echo "### gradle log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/gradle-ci.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### sdk install log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/sdk-install.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 失败时把日志推到 ci-logs 分支（公开仓库 -> 任何人可匿名读取，便于远程排障）
      - name: Push failure log to ci-logs branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request
          repo = "Mengpolar/LDRLife"
          token = os.environ["GITHUB_TOKEN"]
          branch = "ci-logs"
          path = "ci-failure-last.log"
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "ldrlife-ci"}
          def api(url, data=None, method="GET"):
              req = urllib.request.Request(url, data=data, method=method, headers=hdr)
              return json.load(urllib.request.urlopen(req, timeout=30))
          main_sha = api(f"https://api.github.com/repos/{repo}/git/ref/heads/main")["object"]["sha"]
          try:
              api(f"https://api.github.com/repos/{repo}/git/ref/heads/{branch}")
          except Exception:
              api(f"https://api.github.com/repos/{repo}/git/refs",
                  data=json.dumps({"ref": f"refs/heads/{branch}", "sha": main_sha}).encode(), method="POST")
          log_content = open("/tmp/fail-tail.log", "rb").read() if os.path.exists("/tmp/fail-tail.log") else b"no fail-tail"
          full = open("/tmp/gradle-ci.log", "rb").read() if os.path.exists("/tmp/gradle-ci.log") else log_content
          payload = ("=== fail-tail ===\n" + log_content.decode("utf-8", "replace") +
                     "\n\n=== full gradle log ===\n" + full.decode("utf-8", "replace"))
          sha = None
          try:
              sha = api(f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}")["sha"]
          except Exception:
              pass
          body = json.dumps({
              "message": f"ci failure log ({os.environ.get('RUNNER_OS','?')})",
              "content": base64.b64encode(payload.encode("utf-8")).decode(),
              "branch": branch,
              **({"sha": sha} if sha else {}),
          }).encode()
          print(api(f"https://api.github.com/repos/{repo}/contents/{path}", data=body, method="PUT")["commit"]["sha"])
          PYEOF

      - name: Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LDRLife-debug.apk
          sha256sum LDRLife-debug.apk > LDRLife-debug.apk.sha256
          cat LDRLife-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDRLife-debug-apk
          path: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256

      # 打 tag（v*）或手动触发时，创建 GitHub Release 并附 APK 与校验文件（Windows 通道发布）
      - name: Release
        if: success() && runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: v0.1.0
          make_latest: true
          files: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256
