name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 从 GitHub Secrets 恢复 secrets.properties（不入库的构建密钥）
      # 四项齐全时：APK 自动内嵌服务器配置（零配置启动）；缺项则走手动配置兜底
      - name: Restore build secrets
        env:
          LDR_SERVER_URL: ${{ secrets.LDR_SERVER_URL }}
          LDR_GATE: ${{ secrets.LDR_GATE }}
          LDR_ENC_KEY: ${{ secrets.LDR_ENC_KEY }}
          LDR_AMAP_KEY: ${{ secrets.LDR_AMAP_KEY }}
          LDRLIFE_KEYSTORE_B64: ${{ secrets.LDRLIFE_KEYSTORE_B64 }}
          LDRLIFE_KEYSTORE_PASS: ${{ secrets.LDRLIFE_KEYSTORE_PASS }}
        run: |
          if [ -n "$LDR_SERVER_URL" ] && [ -n "$LDR_GATE" ] && [ -n "$LDR_ENC_KEY" ]; then
            {
              echo "ldr.serverUrl=$LDR_SERVER_URL"
              echo "ldr.gate=$LDR_GATE"
              echo "ldr.encKey=$LDR_ENC_KEY"
              echo "ldr.amapKey=$LDR_AMAP_KEY"
              echo "ldr.keystoreFile=ldrlife-ci.keystore"
              echo "ldr.keystorePass=$LDRLIFE_KEYSTORE_PASS"
              echo "ldr.keystoreAlias=ldrlife"
            } > app/secrets.properties
            if [ -n "$LDRLIFE_KEYSTORE_B64" ]; then
              echo "$LDRLIFE_KEYSTORE_B64" | base64 -d > ldrlife-ci.keystore
              echo "签名密钥库已解码 ✓"
            fi
            echo "secrets.properties injected OK"
          else
            echo "GitHub Secrets not fully configured -> manual-setup fallback build"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LDRLife-debug.apk
          sha256sum LDRLife-debug.apk > LDRLife-debug.apk.sha256
          cat LDRLife-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDRLife-debug-apk-${{ runner.os }}
          path: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256

      # 打 tag（v*）时自动创建 GitHub Release 并附 APK 与校验文件（Windows 通道发布）
      - name: Release
        if: success() && runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256
