name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LDRLife-debug.apk
          sha256sum LDRLife-debug.apk > LDRLife-debug.apk.sha256
          cat LDRLife-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDRLife-debug-apk-${{ runner.os }}
          path: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256

      # 打 tag（v*）或手动触发时，创建 GitHub Release 并附 APK 与校验文件（Windows 通道发布）
      - name: Release
        if: success() && runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: v0.0.1
          make_latest: true
          files: |
            LDRLife-debug.apk
            LDRLife-debug.apk.sha256
